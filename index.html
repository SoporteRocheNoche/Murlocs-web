<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roster de la Guild</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="topbar">
        <h1>🐟 Roster de la Guild</h1>
        <p class="subtitle">Gestión de jugadores, clases, especializaciones y profesiones</p>
        <nav class="nav">
            <a class="nav-link active" href="index.html">Añadir jugador</a>
            <a class="nav-link" href="gestion.html">Gestionar jugadores</a>
        </nav>
    </header>

    <main class="container">
        <section class="card form-card">
            <h2>Añadir jugador</h2>
            <form id="player-form" class="player-form">
                <div class="field">
                    <label for="playerName">Nombre del personaje</label>
                    <input type="text" id="playerName" name="playerName" placeholder="Ej. Murlocito" required />
                </div>

                <div class="field">
                    <label for="playerOwner">Jugador</label>
                    <input type="text" id="playerOwner" name="playerOwner" list="ownerList" placeholder="Elige o escribe un jugador" autocomplete="off" />
                    <datalist id="ownerList"></datalist>
                </div>

                <div class="field">
                    <label for="playerClass">Clase</label>
                    <select id="playerClass" name="playerClass" required>
                        <option value="" disabled selected>Selecciona una clase</option>
                    </select>
                </div>

                <div class="field">
                    <label for="playerSpec">Especialización</label>
                    <select id="playerSpec" name="playerSpec" required disabled>
                        <option value="" disabled selected>Selecciona primero una clase</option>
                    </select>
                </div>

                <div class="field">
                    <label for="playerProf1">Profesión 1</label>
                    <select id="playerProf1" name="playerProf1">
                        <option value="">-- Ninguna --</option>
                    </select>
                </div>

                <div class="field">
                    <label for="playerProf2">Profesión 2</label>
                    <select id="playerProf2" name="playerProf2">
                        <option value="">-- Ninguna --</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Añadir jugador</button>
            </form>
            <p id="formMessage" class="message"></p>
        </section>

        <section class="card table-card">
            <div class="table-header">
                <h2>Jugadores</h2>
                <button id="refreshBtn" class="btn-secondary">↻ Recargar</button>
            </div>
            <div class="table-wrapper">
                <table id="players-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Clase</th>
                            <th>Especialización</th>
                            <th>Profesión 1</th>
                            <th>Profesión 2</th>
                            <th>Jugador</th>
                        </tr>
                    </thead>
                    <tbody id="players-tbody">
                        <tr><td colspan="6" class="empty">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
