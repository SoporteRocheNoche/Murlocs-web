<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupos - Roster de la Guild</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="topbar">
        <h1>🐟 Roster de la Guild</h1>
        <p class="subtitle">Organiza grupos nivelados para subir juntos</p>
        <nav class="nav">
            <a class="nav-link" href="index.html">Añadir jugador</a>
            <a class="nav-link" href="gestion.html">Gestionar jugadores</a>
            <a class="nav-link active" href="grupos.html">Grupos</a>
        </nav>
    </header>

    <main class="container groups-container">
        <div class="groups-toolbar">
            <p class="groups-help">Arrastra los personajes a un grupo. Suéltalos en <strong>Crear nuevo grupo</strong> para crear uno, o en <strong>Sin grupo</strong> para sacarlos.</p>
            <button id="refreshBtn" class="btn-secondary">↻ Recargar</button>
        </div>
        <p id="groupsMessage" class="message"></p>

        <div class="groups-layout">
            <section class="card pool-card">
                <div class="pool-header">
                    <h2>Sin grupo <span id="poolCount" class="count-badge">0</span></h2>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar personaje o jugador..." />
                </div>
                <div id="pool" class="dropzone char-list" data-group=""></div>
            </section>

            <section class="groups-board">
                <div id="groupsList" class="groups-grid"></div>
            </section>
        </div>
    </main>

    <div id="levelModal" class="modal-overlay hidden">
        <div class="modal card level-modal">
            <h2 id="levelTitle">Cambiar nivel</h2>
            <form id="levelForm" class="player-form">
                <div class="field">
                    <label for="levelSelect">Nivel</label>
                    <select id="levelSelect"></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelLevelBtn">Cancelar</button>
                    <button type="submit" class="btn-primary" id="saveLevelBtn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="groupModal" class="modal-overlay hidden">
        <div class="modal card">
            <h2 id="groupModalTitle">Editar grupo</h2>
            <form id="groupForm" class="player-form">
                <div class="field field-wide group-field">
                    <label for="groupName">Nombre</label>
                    <input type="text" id="groupName" required />
                </div>
                <div class="field field-wide event-field">
                    <label for="groupTarget">Objetivo</label>
                    <input type="text" id="groupTarget" placeholder="Ej. Hall of Thanes" />
                </div>
                <div class="field event-field">
                    <label for="groupDate">Fecha</label>
                    <input type="date" id="groupDate" />
                </div>
                <div class="field event-field">
                    <label for="groupTime">Hora</label>
                    <input type="time" id="groupTime" />
                </div>
                <div class="field event-field">
                    <label for="groupMinLevel">Nivel mínimo</label>
                    <input type="number" id="groupMinLevel" min="1" max="60" />
                </div>
                <div class="field event-field">
                    <label for="groupMaxLevel">Nivel máximo</label>
                    <input type="number" id="groupMaxLevel" min="1" max="60" />
                </div>
                <div class="field field-wide group-field">
                    <label for="groupNotes">Notas</label>
                    <input type="text" id="groupNotes" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary event-field" id="clearEventBtn">Quitar evento</button>
                    <button type="button" class="btn-secondary" id="cancelGroupBtn">Cancelar</button>
                    <button type="submit" class="btn-primary" id="saveGroupBtn">Guardar</button>
                </div>
            </form>
            <p id="groupFormMessage" class="message"></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/grupos.js"></script>
</body>
</html>
