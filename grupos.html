<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupos - Roster de la Guild</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="topbar">
        <h1>🐟 Roster de la Guild</h1>
        <p class="subtitle">Organiza grupos nivelados para subir juntos</p>
        <nav class="nav">
            <a class="nav-link" href="index.html">Añadir jugador</a>
            <a class="nav-link" href="gestion.html">Gestionar jugadores</a>
            <a class="nav-link active" href="grupos.html">Grupos</a>
        </nav>
    </header>

    <main class="container groups-container">
        <div class="groups-toolbar">
            <p class="groups-help">Arrastra los personajes a un grupo. Suéltalos en <strong>Crear nuevo grupo</strong> para crear uno, o en <strong>Sin grupo</strong> para sacarlos.</p>
            class="btn-secondary">↻ Recargar</button>
        </div>
        <p id="groupsMessage" class="message"></p>

        <div class="groups-layout">
            <section class="card pool-card">
                <div class="pool-header">
                    <h2>Sin grupo <span id="poolCount" class="count-badge">0</span></h2>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar personaje o jugador..." />
                </div>
                <div id="pool" class="dropzone char-list" data-group=""></div>
            </section>

            <section class="groups-board">
                <div id="groupsList" class="groups-grid"></div>
            </section>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/grupos.js"></script>
</body>
</html>
